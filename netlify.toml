[build]
  command = "node tests/pointer-lock-unit.mjs && node tests/enemy-facing-unit.mjs && npm run test:movement:unit && npm run test:mobile:unit && node tests/ui-production-unit.mjs && node tests/ox-delegate-unit.mjs && node tests/ox-verify-output-unit.mjs && npm run test:kimi && node scripts/netlify-validate.mjs && mkdir -p dist/__ox && node scripts/ox-delegate.mjs > dist/__ox/delegate-log.txt 2>&1 && node scripts/ox-verify-output.mjs > dist/__ox/verify-log.txt 2>&1 && node scripts/ox-render-preview.mjs && mkdir -p dist/__kimi && (node scripts/kimi-delegate.mjs > dist/__kimi/delegate-log.txt 2>&1 || echo $? > dist/__kimi/delegate-exit.txt) && (node scripts/kimi-verify-output.mjs > dist/__kimi/verify-log.txt 2>&1 || echo $? > dist/__kimi/verify-exit.txt)"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
