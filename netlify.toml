[build]
  command = "node tests/enemy-facing-unit.mjs && npm run test:mobile:unit && node tests/ox-delegate-unit.mjs && node tests/ox-verify-output-unit.mjs && node scripts/netlify-validate.mjs && mkdir -p dist/__ox && (node scripts/ox-delegate.mjs > dist/__ox/delegate-log.txt 2>&1 || true)"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"