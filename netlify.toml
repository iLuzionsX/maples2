[build]
  command = "node tests/enemy-facing-unit.mjs && npm run test:movement:unit && npm run test:mobile:unit && node tests/ui-production-unit.mjs && node scripts/netlify-validate.mjs && (node scripts/performance-branch-runner.mjs > dist/perf-runner-log.txt 2>&1 || true)"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
