[build]
  command = "node tests/pointer-lock-unit.mjs && node tests/enemy-facing-unit.mjs && npm run test:movement:unit && npm run test:mobile:unit && node tests/ui-production-unit.mjs && node tests/ox-delegate-unit.mjs && node tests/ox-verify-output-unit.mjs && node tests/kimi-delegate-unit.mjs && node tests/kimi-verify-output-unit.mjs && node scripts/netlify-validate.mjs && mkdir -p dist/__ox && node scripts/ox-delegate.mjs > dist/__ox/delegate-log.txt 2>&1 && node scripts/ox-verify-output.mjs > dist/__ox/verify-log.txt 2>&1 && node scripts/ox-render-preview.mjs && mkdir -p dist/__kimi && sed -i 's/const REQUEST_TIMEOUT_MS = 600_000;/const REQUEST_TIMEOUT_MS = 720_000;/' scripts/kimi-delegate.mjs && node scripts/kimi-delegate.mjs > dist/__kimi/delegate-log.txt 2>&1 && node scripts/kimi-verify-output.mjs > dist/__kimi/verify-log.txt 2>&1"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
