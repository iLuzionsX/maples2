[build]
  command = "npm run test:town && node tests/enemy-facing-unit.mjs && npm run test:mobile:unit && node scripts/netlify-validate.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"