[build]
  command = "node tests/enemy-facing-unit.mjs && npm run test:movement:unit && npm run test:mobile:unit && node tests/ui-production-unit.mjs && node tests/ox-delegate-unit.mjs && node tests/ox-harness-resilience-unit.mjs && node tests/ox-verify-output-unit.mjs && node scripts/ox-netlify-orchestrator.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"