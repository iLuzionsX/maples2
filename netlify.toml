[build]
  command = "node tests/enemy-facing-unit.mjs && npm run test:movement:unit && npm run test:mobile:unit && node tests/ui-production-unit.mjs && node tests/ox-delegate-unit.mjs && node tests/ox-harness-resilience-unit.mjs && node tests/ox-verify-output-unit.mjs && node scripts/ox-netlify-orchestrator.mjs && node -e \"const fs=require('fs');const s=JSON.parse(fs.readFileSync('dist/__ox/harness-status.json','utf8'));if(!s.ok||s.stage!=='complete'){console.error('OX STRICT PROOF FAIL:',s.stage,s.detail);process.exit(1)}console.log('OX STRICT PROOF PASS')\""
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"