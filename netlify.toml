[build]
  command = "node tests/enemy-facing-unit.mjs && npm run test:mobile:unit && node tests/ox-delegate-unit.mjs && node scripts/ox-delegate.mjs && node scripts/netlify-validate.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"